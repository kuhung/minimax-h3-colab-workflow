name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install 'Pillow>=10,<13'
      - name: Compile Python scripts and tests
        run: python -c "import pathlib, py_compile; [py_compile.compile(str(p), doraise=True) for root in ('scripts', 'tests') for p in pathlib.Path(root).rglob('*.py')]"
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Inspect image demo command
        run: python scripts/demo_h3_image.py --dry-run
